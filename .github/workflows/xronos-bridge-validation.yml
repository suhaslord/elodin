name: Xronos bridge validation

on:
  push:
    branches:
      - suhas/xronos-elodin-bridge-prototype
    paths:
      - 'examples/xronos_bridge/**'
      - '.github/workflows/xronos-bridge-validation.yml'
  pull_request:
    paths:
      - 'examples/xronos_bridge/**'
      - '.github/workflows/xronos-bridge-validation.yml'

jobs:
  real-xronos-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real Xronos and Elodin runtimes
        run: python -m pip install --upgrade pip 'xronos==0.13.0' 'elodin==0.19.0'
      - name: Prove real Xronos reacts to one state
        working-directory: examples/xronos_bridge
        shell: bash
        run: |
          set -u
          printf '%s\n' '{"tick":0,"position":2.0,"velocity":-0.1}' | timeout 15s python xronos_controller.py > /tmp/xronos_one_shot.txt 2>&1 || true
          cat /tmp/xronos_one_shot.txt
          grep -F '"tick":0' /tmp/xronos_one_shot.txt
      - name: Run deterministic persistent replay against Xronos
        working-directory: examples/xronos_bridge
        run: timeout 30s python replay_check.py sample_states.jsonl
      - name: Run Xronos to Elodin external-control force integration
        working-directory: examples/xronos_bridge
        run: timeout 90s python elodin_control_integration.py
