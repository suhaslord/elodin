name: Xronos bridge validation

on:
  push:
    branches:
      - suhas/xronos-elodin-bridge-prototype
    paths:
      - 'examples/xronos_bridge/**'
      - '.github/workflows/xronos-bridge-validation.yml'
  pull_request:
    paths:
      - 'examples/xronos_bridge/**'
      - '.github/workflows/xronos-bridge-validation.yml'

jobs:
  real-xronos-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real Xronos runtime
        run: python -m pip install --upgrade pip 'xronos==0.13.0'
      - name: Run deterministic replay against Xronos
        working-directory: examples/xronos_bridge
        run: python replay_check.py sample_states.jsonl
