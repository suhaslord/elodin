name: Antarctica public validation

on:
  push:
    branches:
      - suhas/spice-validation-runs-20260913
    paths:
      - 'research_validation/antarctica/**'
      - '.github/workflows/antarctica-public-inspect.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install readers
        run: python -m pip install netCDF4 numpy pandas
      - name: Download checksum-verified public RL06.3Mv04 inputs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/antarctica/l4 results/antarctica
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 600 \
            -o /tmp/antarctica/l3.nc \
            'https://zenodo.org/api/records/20535360/files/GRCTellus.JPL.200204_202601.GLO.RL06.3M.MSCNv04CRI.nc/content'
          echo 'd7aa7765f8e84a1b29c686aeae476523  /tmp/antarctica/l3.nc' | md5sum -c -
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -o /tmp/antarctica/l4.zip \
            'https://www.jkclimate.fr/Dashboard2025/formatted_data/Antarctic_ice_sheet_data_files.zip'
          echo 'c2bebfc718c79e60d24c661b06eb47f8  /tmp/antarctica/l4.zip' | md5sum -c -
          unzip -q /tmp/antarctica/l4.zip -d /tmp/antarctica/l4
          find /tmp/antarctica/l4 -maxdepth 3 -type f -printf '%p\n' | sort | tee results/antarctica/file_inventory.txt
      - name: Reproduce Antarctica total mass and validate
        run: |
          python research_validation/antarctica/validate_public_antarctica.py \
            --l3 /tmp/antarctica/l3.nc \
            --l4 /tmp/antarctica/l4/antarctica_GRACE_Antarctica.csv \
            --out-dir results/antarctica | tee results/antarctica/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antarctica-public-validation
          path: results/antarctica/
          if-no-files-found: warn
