name: DSN OSF inspect

on:
  push:
    branches:
      - suhas/dsn-heldout-validation-20260913
    paths:
      - '.github/workflows/dsn-osf-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect OSF DSN file metadata and README
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from urllib.request import urlopen
          u='https://api.osf.io/v2/nodes/t9c2a/files/osfstorage/'
          with urlopen(u, timeout=30) as r:
              data=json.load(r)['data']
          for x in data:
              a=x['attributes']
              print(a['name'], a.get('size'), x['links'].get('download'))
          readme=next(x for x in data if x['attributes']['name']=='README.Rmd')
          with urlopen(readme['links']['download'], timeout=30) as r:
              text=r.read().decode('utf-8', errors='replace')
          print('--- README.Rmd ---')
          print(text)
          PY
